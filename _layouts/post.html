---
layout: default
---
{% include nav.html %}
<main id="main-content" class="post-page">
  <article class="post container">
    <header class="post-header">
      <a class="back-link" href="{{ '/blog/' | relative_url }}">&larr; All posts</a>
      <p class="eyebrow">{{ page.category | default: 'Notes' }} / {{ page.date | date: "%d %b %Y" }}</p>
      <h1>{{ page.title }}</h1>
      <p class="post-deck">{{ page.description }}</p>
      <ul class="inline-tags">{% for tag in page.tags %}<li>{{ tag }}</li>{% endfor %}</ul>
    </header>

    <div class="post-content">
      {{ content }}
    </div>

    <footer class="post-bottom">
      <span>End of note.</span>
      <a class="text-link" href="{{ '/blog/' | relative_url }}">&larr; Back to all posts</a>
    </footer>
  </article>
</main>
