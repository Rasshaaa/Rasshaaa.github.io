<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f9f8f5">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.data.profile.short_name }}.</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  {{ content }}

  <footer class="footer">
    <div class="container footer-inner">
      <span>&copy; <span id="year">2026</span> {{ site.data.profile.short_name }}. Built for the curious.</span>
      <a href="{{ '/' | relative_url }}#Home">Back to top &uarr;</a>
    </div>
  </footer>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/rellax/1.12.1/rellax.min.js" defer></script>
  <script src="{{ '/script.js' | relative_url }}" defer></script>
</body>
</html>
